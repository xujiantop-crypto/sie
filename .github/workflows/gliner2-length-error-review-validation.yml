name: GLiNER2 length-error review validation
on:
  push:
    branches: [test/gliner2-length-error-review-validation-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac
        with:
          version: 2026.5.5
          install_args: --jobs=1
          cache: false
      - run: mise tasks
      - run: mise exec -- uv lock --check --project .
      - run: mise exec -- uv sync --frozen --project . --all-packages --no-install-package sie-audio-prep
      - name: Require the pinned real GLiNER2 processor
        run: >-
          mise exec -- uv run --frozen --project . --no-sync python -c
          'import gliner2.processor; import importlib.metadata as m; assert m.version("gliner2") == "1.3.2"; print("gliner2", m.version("gliner2"))'
      - name: Reproduce positive token billing on the previous PR head
        shell: bash
        run: |
          queue=packages/sie_server/src/sie_server/queue_executor.py
          cp "$queue" /tmp/gliner2-fixed-queue.py
          trap 'cp /tmp/gliner2-fixed-queue.py "$queue"' EXIT
          git show 18a33c365741a5fe768382578d58d46e3b7df358:"$queue" > "$queue"
          set +e
          mise exec -- uv run --frozen --project . --no-sync pytest -q packages/sie_server/tests/adapters/test_gliner2_complete_text.py -k test_queue_length_error_overrides_reported_positive_billing > /tmp/gliner2-baseline.log 2>&1
          result=$?
          set -e
          cat /tmp/gliner2-baseline.log
          test "$result" = 1
          grep -q '1 failed, 1 passed' /tmp/gliner2-baseline.log
          grep -q 'assert 7 == 0' /tmp/gliner2-baseline.log
      - name: Adapter, queue and HTTP regressions
        run: >-
          mise exec -- uv run --frozen --project . --no-sync pytest -q
          packages/sie_server/tests/adapters/test_gliner2*.py
          packages/sie_server/tests/adapters/test_word_window.py
          packages/sie_server/tests/test_queue_executor.py
          packages/sie_server/tests/test_queue_executor_stage1d.py
          packages/sie_server/tests/api/test_extract.py
          packages/sie_server/tests/api/test_error_code_hygiene.py
          packages/sie_server/tests/core/worker
      - run: mise run lint
      - run: mise run typecheck
      - name: Full public Python unit suite
        run: mise run test
